name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show current directory
      run: pwd
    
    - name: List files
      run: ls -la
    
    - name: Show Python version
      run: python3 --version
    
    - name: Show who we are
      run: echo "Hello from GitHub Actions!"
