name: Docker Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        cd 03_Docker/compose_demo
        docker build -t site-monitor:test .
    
    - name: Verify image was built
      run: docker images | grep site-monitor
    
    - name: Run tests (check sites)
      run: |
        cd 03_Docker/compose_demo
        docker run --rm site-monitor:test python check_site_ci.py

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Tag image for Docker Hub
      if: github.event_name == 'push'
      run: |
        docker tag site-monitor:test ${{ secrets.DOCKER_USERNAME }}/site-monitor:latest
        docker tag site-monitor:test ${{ secrets.DOCKER_USERNAME }}/site-monitor:${{ github.sha }}
    
    - name: Push to Docker Hub
      if: github.event_name == 'push'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/site-monitor:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/site-monitor:${{ github.sha }}
