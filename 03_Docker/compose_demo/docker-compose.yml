version: '3.8'

services:
  monitor:
    build: .
    container_name: site-monitor
    environment:
      - TZ=Europe/Moscow
    networks:
      - monitoring-net

  db:
    image: postgres:15-alpine
    container_name: monitor-db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitoring-net

volumes:
  postgres_data:

networks:
  monitoring-net:
    driver: bridge
