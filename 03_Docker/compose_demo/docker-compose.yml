services:
  db:
    image: postgres:15-alpine
    container_name: monitor-db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-monitor
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      DB_HOST: db
      POSTGRES_DB: monitoring
      POSTGRES_PASSWORD: secret123
      POSTGRES_USER: monitor
      TZ: Europe/Moscow
    networks:
      - monitoring-net

volumes:
  postgres_data:

networks:
  monitoring-net:
    driver: bridge
